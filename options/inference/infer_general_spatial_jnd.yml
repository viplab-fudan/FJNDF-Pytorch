name: general_spatial_jnd
type: SpatialJNDModel

block_sz: 8

channel: 'Y'
normalized: False

target: 1
seed: 123 # only used when target is set to 0: random inject

effect:
  - type: LA
    model: TMMwu2013
    weight: 1.0
    params:
      T0: 17.0
      slope: 0.0234
      bg_threshold: 127.0

  - type: CM
    model: TMMwu2013
    weight: 1.0
    params:
      intercept: 0.5
      bg_coeff: 0.01
      a_coeff: 0.00001
      constant: 0.115
      bg_threshold: 127.0

  - type: PM
    model: TMMwu2013
    weight: 1.0
    params:
      k: 0.5

fusion:
  method: sum
