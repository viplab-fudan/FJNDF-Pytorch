name: general_frequency_jnd
type: FrequencyJNDModel

transform: dct2d_8x8
block_sz: 8

channel: 'Y'
normalized: False

target: 1
seed: 123 # only used when target is set to 0: random inject

effect:
  - type: CSF
    model: SPLbae2013
    weight: 1.0
    params:
      s: 1.0
      dct_size: 8
      r_vh: 1.75
      screen_h: 1080

  - type: LA
    model: SPLbae2013
    weight: 1.0
    params:
      threshold_split: 0.3
      dct_size: 8
      r_vh: 1.75
      screen_h: 1080

fusion:
  method: product