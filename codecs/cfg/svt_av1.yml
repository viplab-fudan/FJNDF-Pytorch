name: svt_av1

encoder_param:
    --preset: 12
    --keyint: 200 # greater than 100 to ensure only one I frame
    --fps: 25
    --frames: 100 # set by encode.py
    --rc: 2 # set by encode.py
    --aq-mode: 2 # set by encode.py
    --qp: 22 # set by encode.py
    --tbr: 7776 # set by encode.py
    --passes: 1
    --recon: ../../dataset/tmp/svac_beihaihumian_80_svt_av1_enc.yuv # set by encode.py
    --output: ../../dataset/tmp/svac_beihaihumian_80_svt_av1.bin # set by encode.py
    --lp: 1
    --pred-struct: 1
    --lookahead: 0

video_param:
    --input: ../../dataset/ori/svac/R_1920x1080_beihaihumian_50fps_500.yuv # set by encode.py
    --width: 1920 # set by encode.py
    --height: 1080  # set by encode.py
    --input-depth: 8